[project]
name = "adk-x402-demo"
version = "0.1.0"
description = "ADK x402 Payment Protocol Demo using refactored x402_a2a package"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk",
    "google-adk>=0.5.0",
    "x402>=0.1.4",
    "click>=8.2.0",
    "eth-account>=0.13.7",
    "httpx>=0.28.1",
    "uvicorn>=0.34.2",
    "web3>=7.10.0",
    "cdp-sdk>=1.20.0",
    "x402-a2a",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["server", "client"]

[project.scripts]
server = "server.__main__:main"

[tool.uv.workspace]
members = ["client"]

[tool.uv.sources]
x402-a2a = { path = "../../../python/x402_a2a", editable = true }

[tool.ruff]
target-version = "py313"
# Ruff 0.17+ also formats Python code blocks in Markdown; keep docs out of CI checks.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Pin the rule set to ruff's long-standing defaults. CI runs an unpinned `uvx ruff`,
# and ruff 0.16+ enables many more rules by default, which fails CI on unchanged code.
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
lint = [
    "ruff>=0.13.1",
]
